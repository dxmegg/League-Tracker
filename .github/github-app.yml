scripts:
  - name: Install dependencies
    command: npm ci
    triggers:
      - session.create
  - name: Typecheck
    command: npm run typecheck
  - name: Lint
    command: npm run lint
  - name: Build
    command: npm run build
  - name: Start development app
    command: npm run dev
server_ready_pattern: "(?i)(https?://localhost:\\d+)"
automation:
  auto_issue_session: true
  remote_control: false