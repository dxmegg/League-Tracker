scripts:
  - name: Install dependencies
    command: powershell -NoProfile -Command "if (-not (Test-Path 'node_modules/.bin/tsc.cmd')) { npm install } else { Write-Host 'node_modules present, skipping install' }"
    triggers:
      - session.create
  - name: Typecheck
    command: npm run typecheck
  - name: Lint
    command: npm run lint
  - name: Build
    command: npm run build
  - name: Start development app
    command: npm run dev
server_ready_pattern: "(?i)(https?://localhost:\\d+)"
automation:
  auto_issue_session: true
  remote_control: false